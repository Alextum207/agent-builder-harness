[project]
name = "test-lead-agent"
version = "0.1.0"
description = "Test: Lead-Bewertungs-Agent fuer build-agent Skill"
authors = [
    { name = "Alexander Saade", email = "alexander.saade@tum.de" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-guardrails>=0.2.0",
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "truststore>=0.10.5",
]


[tool.uv]
package = false

[tool.uv.sources]
agent-guardrails = { path = "../packages/agent-guardrails", editable = true }
