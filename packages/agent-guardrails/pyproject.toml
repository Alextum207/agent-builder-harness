[project]
name = "agent-guardrails"
version = "0.3.0"
description = "Zentrale Guardrails und Rechte für die Agenten des Harness"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.5",
    "langgraph>=1.2.15",
    "opentelemetry-sdk>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_guardrails"]
