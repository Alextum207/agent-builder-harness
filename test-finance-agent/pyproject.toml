[project]
name = "test-finance-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agent-guardrails>=0.1.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "truststore>=0.10.5",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-guardrails = { path = "../packages/agent-guardrails", editable = true }
